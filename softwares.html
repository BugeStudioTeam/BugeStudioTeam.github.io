<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Buge Studio - Softwares</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* ---------- 1:1 复刻原版全局变量 ---------- */
        :root {
            --bg-dark: #0b1321;
            --bg-light: #f4f9ff;
            --text-dark: #0a1e3c;
            --text-light: #f0f7ff;
            --accent-blue: #1e88e5;
            --accent-soft: #64b5f6;
            --card-bg-light: rgba(255, 255, 255, 0.7);
            --card-bg-dark: rgba(15, 30, 50, 0.8);
            --nav-bg-light: rgba(255, 255, 255, 0.75);
            --nav-bg-dark: rgba(8, 20, 35, 0.85);
            --border-light: rgba(30, 136, 229, 0.2);
            --shadow-color: rgba(0, 40, 100, 0.2);
            --github-green: #2e7d32;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-dark: #030c17;
                --bg-light: #0d1a2b;
                --text-dark: #e0edff;
                --card-bg-light: rgba(15, 30, 45, 0.8);
                --nav-bg-light: rgba(8, 18, 33, 0.9);
                --shadow-color: rgba(0, 20, 60, 0.6);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 30% 10%, var(--bg-light), var(--bg-dark));
            background-attachment: fixed;
            color: var(--text-dark);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 导航栏 */
        .global-nav {
            position: fixed;
            top: 24px; left: 5%; right: 5%;
            width: 90%; max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--nav-bg-light);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 80px;
            padding: 12px 28px;
            border: 1px solid var(--border-light);
            box-shadow: 0 20px 40px var(--shadow-color);
            z-index: 1000;
        }

        .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .nav-logo img { width: 44px; height: 44px; border-radius: 16px; }
        .nav-logo span {
            font-size: 2.2rem; font-weight: 800; letter-spacing: -1.5px;
            background: linear-gradient(135deg, var(--accent-blue), #90caf9);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }

        .lang-switch { display: flex; gap: 8px; background: rgba(128,128,128,0.1); padding: 6px; border-radius: 40px; }
        .lang-option { padding: 8px 16px; border-radius: 32px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        .lang-option.active { background: var(--accent-blue); color: #fff; }

        /* 内容区 */
        main { flex: 1; padding: 160px 5% 60px; max-width: 1400px; margin: 0 auto; width: 100%; }
        
        .page-header { margin-bottom: 50px; }
        /* Our Softwares 蓝色渐变 */
        .page-header h1 { 
            font-size: clamp(2.5rem, 8vw, 4rem); 
            font-weight: 800; 
            letter-spacing: -2px;
            background: linear-gradient(135deg, var(--accent-blue), #90caf9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* 软件列表布局 */
        .software-list { display: flex; flex-direction: column; gap: 30px; }

        .software-card {
            background: var(--card-bg-light);
            backdrop-filter: blur(15px);
            border-radius: 56px;
            padding: 45px;
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 40px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            box-shadow: 0 15px 35px var(--shadow-color);
        }
        .software-card:hover { transform: scale(1.02); border-color: var(--accent-blue); }

        .card-icon { width: 110px; height: 110px; border-radius: 32px; flex-shrink: 0; overflow: hidden; }
        .card-icon img { width: 100%; height: 100%; object-fit: cover; }

        .card-info { flex: 1; }
        /* Buge App Manager 蓝色渐变 */
        .card-info h3 { 
            font-size: 2.2rem; 
            font-weight: 800; 
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent-blue), #90caf9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }
        .card-info p { font-size: 1.2rem; opacity: 0.8; max-width: 800px; margin-bottom: 25px; }

        .btn-group { display: flex; gap: 12px; }
        .action-btn {
            padding: 12px 28px; border-radius: 30px; text-decoration: none;
            font-weight: 700; font-size: 1.1rem; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-blue { background: var(--accent-blue); color: white; }
        .btn-green { background: var(--github-green); color: white; }
        .action-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* 版权底部 */
        footer { padding: 60px 0; text-align: center; }
        footer p { color: #ffffff !important; font-size: 1.1rem; font-weight: 500; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }

        @media (max-width: 768px) {
            .software-card { flex-direction: column; text-align: center; padding: 35px; border-radius: 40px; }
            .btn-group { justify-content: center; }
        }
    </style>
</head>
<body>

    <nav class="global-nav">
        <a href="https://bugestudioteam.github.io" class="nav-logo">
            <img src="icon.png" alt="Buge Studio">
            <span data-i18n="brand">Buge Studio</span>
        </a>
        <div class="lang-switch">
            <span class="lang-option active" data-lang="en">EN</span>
            <span class="lang-option" data-lang="de">DE</span>
            <span class="lang-option" data-lang="ru">RU</span>
            <span class="lang-option" data-lang="zh">中文</span>
        </div>
    </nav>

    <main>
        <header class="page-header">
            <h1 data-i18n="page_title">Our Softwares</h1>
        </header>

        <div class="software-list">
            <div class="software-card" onclick="window.location.href='https://bugestudioteam.github.io/appmanager';">
                <div class="card-icon">
                    <img src="AppManager.jpg" alt="App Manager">
                </div>
                <div class="card-info">
                    <h3>Buge App Manager</h3>
                    <p data-i18n="manager_desc">A powerful Android tool for app and permission management, requiring Shizuku support.</p>
                    <div class="btn-group">
                        <a href="https://github.com/BugeStudioTeam/Buge-App-Manager" target="_blank" class="action-btn btn-blue" onclick="event.stopPropagation();">
                            <i class="fab fa-github"></i> GitHub
                        </a>
                        <a href="https://github.com/BugeStudioTeam/Buge-App-Manager/releases/download/AppManager2.2.0/BugeAppManager-v2.2.0-release.apk" target="_blank" class="action-btn btn-green" onclick="event.stopPropagation();">
                            <i class="fas fa-download"></i> Download
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Buge Studio</p>
    </footer>

    <script>
        (function() {
            const translations = {
                en: { brand: "Buge Studio", page_title: "Our Softwares", manager_desc: "Buge App Manager is a powerful Android tool for app and permission management, requiring Shizuku support." },
                de: { brand: "Buge Studio", page_title: "Unsere Software", manager_desc: "Buge App Manager ist ein leistungsstarkes Android-Tool für App- und Berechtigungsverwaltung, das Shizuku benötigt." },
                ru: { brand: "Buge Studio", page_title: "Наше ПО", manager_desc: "Buge App Manager — мощный инструмент для Android для управления приложениями и разрешениями, требующий Shizuku." },
                zh: { brand: "Buge Studio", page_title: "我们的软件", manager_desc: "Buge App Manager 是一款强大的 Android 应用与权限管理工具，需要 Shizuku 支持。" }
            };

            function updateLanguage(lang) {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (translations[lang][key]) el.innerText = translations[lang][key];
                });
            }

            const langOptions = document.querySelectorAll('.lang-option');
            langOptions.forEach(opt => {
                opt.addEventListener('click', function() {
                    langOptions.forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    updateLanguage(this.getAttribute('data-lang'));
                });
            });

            updateLanguage('en');

            // 背景随动逻辑
            window.addEventListener('scroll', () => {
                const scrollPercent = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
                const x = 30 + scrollPercent * 20;
                const y = 10 + scrollPercent * 20;
                document.body.style.background = `radial-gradient(circle at ${x}% ${y}%, var(--bg-light), var(--bg-dark))`;
            });
        })();
    </script>
</body>
</html>
