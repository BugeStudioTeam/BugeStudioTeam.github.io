<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>All Softwares - Buge Studio</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ---------- Global variables with dark mode support (完全同步主页风格) ---------- */
        :root {
            --bg-dark: #0b1321;
            --bg-light: #f4f9ff;
            --text-dark: #0a1e3c;
            --text-light: #f0f7ff;
            --accent-blue: #1e88e5;
            --accent-soft: #64b5f6;
            --card-bg-light: rgba(255,255,255,0.7);
            --card-bg-dark: rgba(15,30,50,0.8);
            --nav-bg-light: rgba(255,255,255,0.75);
            --nav-bg-dark: rgba(8,20,35,0.85);
            --border-light: rgba(30,136,229,0.2);
            --shadow-color: rgba(0,40,100,0.2);
            --logo-filter: none;
            --footer-text: #ffffff;
            --white-text: #ffffff;
            --github-green: #2e7d32;
            --github-green-hover: #1b5e20;
            --support-orange: #ff9800;
            --support-orange-hover: #f57c00;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-dark: #030c17;
                --bg-light: #0d1a2b;
                --text-dark: #e0edff;
                --text-light: #ffffff;
                --accent-blue: #64b5f6;
                --accent-soft: #1e4b77;
                --card-bg-light: rgba(15,30,45,0.8);
                --card-bg-dark: rgba(5,15,28,0.9);
                --nav-bg-light: rgba(8,18,33,0.9);
                --nav-bg-dark: rgba(2,10,22,0.95);
                --border-light: rgba(100,181,246,0.25);
                --shadow-color: rgba(0,20,60,0.6);
                --logo-filter: brightness(0.9);
                --footer-text: #ffffff;
                --white-text: #ffffff;
                --github-green: #2e7d32;
                --github-green-hover: #1b5e20;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 30% 10%, var(--bg-light), var(--bg-dark));
            color: var(--text-dark);
            line-height: 1.5;
            overflow-x: hidden;
            transition: background 0.3s, color 0.2s;
        }

        /* ----- Floating navigation bar (完全复刻主页) ----- */
        .global-nav {
            position: fixed;
            top: 24px;
            left: 5%;
            right: 5%;
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: var(--nav-bg-light);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 80px;
            padding: 12px 28px;
            border: 1px solid var(--border-light);
            box-shadow: 0 20px 40px var(--shadow-color);
            z-index: 100;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-logo img {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            object-fit: contain;
            filter: var(--logo-filter);
        }
        .nav-logo span {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--accent-blue), #90caf9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Language switcher - 支持多语言 (与主页一致) */
        .lang-switch {
            display: flex;
            gap: 8px;
            background: rgba(128,128,128,0.1);
            padding: 6px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .lang-option {
            padding: 8px 16px;
            border-radius: 32px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            color: var(--text-dark);
            border: 1px solid transparent;
            font-size: 0.95rem;
        }
        .lang-option.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }
        .lang-option:not(.active):hover {
            background: rgba(100,181,246,0.2);
            border-color: var(--accent-soft);
        }

        /* Main content */
        main {
            padding-top: 140px;
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 页面头部区域 (与hero呼应) */
        .page-header {
            margin-bottom: 40px;
            padding: 20px 0 40px;
            border-bottom: 2px solid var(--border-light);
        }
        .page-header h1 {
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 800;
            background: linear-gradient(145deg, var(--accent-blue), #bbdefb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }
        .page-header p {
            font-size: 1.3rem;
            max-width: 800px;
            color: var(--text-dark);
            opacity: 0.85;
            border-left: 5px solid var(--accent-blue);
            padding-left: 24px;
        }

        /* 软件网格 - 增强型卡片布局 (和主页一致但容纳更多条目) */
        .all-softwares-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 40px;
            margin: 40px 0 80px;
        }

        .software-card {
            background: var(--card-bg-light);
            backdrop-filter: blur(16px);
            border-radius: 64px;
            padding: 40px 32px;
            border: 2px solid var(--border-light);
            box-shadow: 0 30px 60px -10px var(--shadow-color);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        .software-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 40px 80px -10px var(--accent-blue);
        }
        .card-icon {
            width: 110px;
            height: 110px;
            border-radius: 32px;
            overflow: hidden;
            background: rgba(30,136,229,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
        }
        .card-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-icon i {
            font-size: 3.8rem;
            color: var(--accent-blue);
        }
        .software-card h3 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
        }
        .software-card .description {
            font-size: 1.1rem;
            opacity: 0.85;
            margin-bottom: 28px;
            line-height: 1.5;
            flex-grow: 1;
            color: var(--text-dark);
        }
        .button-container {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .card-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: var(--accent-blue);
            text-decoration: none;
            border-radius: 40px;
            transition: all 0.2s;
            box-shadow: 0 6px 12px rgba(30,136,229,0.25);
            cursor: pointer;
        }
        .card-link:hover {
            background: #1565c0;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(30,136,229,0.4);
        }
        .github-link {
            background: var(--github-green);
        }
        .github-link:hover {
            background: var(--github-green-hover);
        }
        .download-link {
            background: var(--support-orange);
        }
        .download-link:hover {
            background: var(--support-orange-hover);
        }

        /* 空状态或额外说明 */
        .info-note {
            background: rgba(100,181,246,0.15);
            border-radius: 48px;
            padding: 28px 32px;
            margin: 40px 0 60px;
            text-align: center;
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-light);
        }
        .info-note p {
            font-size: 1.2rem;
            color: var(--text-dark);
        }
        .info-note a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
        }

        footer {
            margin-top: 80px;
            padding: 40px 0;
            text-align: center;
            border-top: 1px solid var(--border-light);
            color: #ffffff !important;
            font-size: 1rem;
            font-weight: 400;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        footer p {
            color: #ffffff !important;
        }

        @media (max-width: 800px) {
            .global-nav {
                top: 16px;
                border-radius: 40px;
                padding: 10px 20px;
            }
            .nav-logo span { font-size: 1.5rem; }
            .software-card { padding: 32px 24px; }
            .software-card h3 { font-size: 1.8rem; }
            .card-icon {
                width: 85px;
                height: 85px;
            }
        }

        @media (max-width: 600px) {
            main {
                padding-top: 120px;
            }
            .button-container {
                flex-direction: column;
                width: 100%;
            }
            .card-link {
                width: 100%;
                justify-content: center;
            }
            .page-header p {
                font-size: 1.1rem;
            }
        }

        .fade-out {
            transition: opacity 0.5s ease, transform 0.4s;
        }
        .fade-out.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .fade-out.hidden {
            opacity: 0;
            transform: translateY(30px);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <nav class="global-nav">
        <a href="https://bugestudioteam.github.io" class="nav-logo" style="text-decoration: none;">
            <img src="icon.png" alt="Buge Studio" id="navIcon" onerror="this.style.display='none'; this.parentNode.querySelector('.fallback-emoji').style.display='block';">
            <span class="fallback-emoji" style="display:none;">⚡</span>
            <span data-i18n="brand">Buge Studio</span>
        </a>
        <div class="lang-switch">
            <span class="lang-option active" data-lang="en">EN</span>
            <span class="lang-option" data-lang="de">DE</span>
            <span class="lang-option" data-lang="ru">RU</span>
            <span class="lang-option" data-lang="zh">中文</span>
        </div>
    </nav>

    <main>
        <div class="page-header fade-out visible">
            <h1 data-i18n="all_soft_title">All Softwares</h1>
            <p data-i18n="all_soft_sub">Discover all tools built by Buge Studio. Open-source, powerful, and designed for everyone.</p>
        </div>

        <div class="all-softwares-grid fade-out visible" id="softwaresContainer">
            <!-- 软件卡片将通过JS动态生成以保证多语言动态更新，结构与主页一致 -->
        </div>

        <div class="info-note fade-out visible" id="infoNote">
            <p data-i18n="more_note">✨ More exciting projects are on the way. Stay tuned! <br> Visit our <a href="https://github.com/BugeStudioTeam" target="_blank">GitHub</a> for source code and contributions.</p>
        </div>

        <footer>
            <p>© 2026 Buge Studio<span data-i18n="footer_tagline"></p>
        </footer>
    </main>

    <script>
        (function() {
            // ----- 软件数据定义 (只保留 Buge App Manager，其他为占位展示但实际只有一个主软件，根据需求: 只有 Buge App Manager)
            // 按照用户要求: "我只有buge app manager"，所以只展示一个软件卡片，但为了页面美观，仅显示一个卡片，但网格样式依旧优雅
            const softwaresList = [
                {
                    id: "appmanager",
                    nameKey: "app_name",
                    descKey: "app_desc",
                    iconImg: "AppManager.jpg",
                    fallbackIcon: "fas fa-cubes",
                    github: "https://github.com/BugeStudioTeam/Buge-App-Manager",
                    downloadUrl: "https://github.com/BugeStudioTeam/Buge-App-Manager/releases/download/AppManager2.2.0/BugeAppManager-v2.2.0-release.apk",
                    website: "https://bugestudioteam.github.io/appmanager",  // 点击卡片跳转地址
                    extraClass: ""
                }
            ];

            // 多语言文本库 (与主页保持术语统一，增加新字段，默认英文)
            const translations = {
                en: {
                    brand: "Buge Studio",
                    all_soft_title: "All Softwares",
                    all_soft_sub: "Discover all tools built by Buge Studio. Open-source, powerful, and designed for everyone.",
                    more_note: "✨ More exciting projects are on the way. Stay tuned! Visit our GitHub for source code and contributions.",
                    footer_tagline: "",
                    // 软件名称 & 描述
                    app_name: "Buge App Manager",
                    app_desc: "Powerful Android app & permission manager (requires Shizuku). Manage apps like a pro."
                },
                de: {
                    brand: "Buge Studio",
                    all_soft_title: "Alle Software",
                    all_soft_sub: "Entdecken Sie alle Tools von Buge Studio. Open-Source, leistungsstark und für alle entwickelt.",
                    more_note: "✨ Weitere spannende Projekte sind in Arbeit. Bleiben Sie dran! Besuchen Sie unser GitHub für Quellcode und Beiträge.",
                    footer_tagline: "Open Source. Einfach. Wirkungsvoll.",
                    app_name: "Buge App Manager",
                    app_desc: "Leistungsstarkes Android-Tool für App- und Berechtigungsverwaltung (erfordert Shizuku). Verwalten Sie Apps wie ein Profi."
                },
                ru: {
                    brand: "Buge Studio",
                    all_soft_title: "Все программы",
                    all_soft_sub: "Откройте для себя все инструменты Buge Studio. Открытый исходный код, мощные и созданные для всех.",
                    more_note: "✨ В ближайшее время появятся новые проекты. Следите за обновлениями! Посетите GitHub для кода и вклада.",
                    footer_tagline: "Открытый код. Просто. Значимо.",
                    app_name: "Buge App Manager",
                    app_desc: "Мощный инструмент для управления приложениями и разрешениями на Android (требуется Shizuku)."
                },
                zh: {
                    brand: "Buge Studio",
                    all_soft_title: "所有软件",
                    all_soft_sub: "探索 Buge Studio 打造的所有工具。开源、强大，为每个人设计。",
                    more_note: "✨ 更多精彩项目即将到来。敬请期待！访问我们的 GitHub 获取源代码和贡献。",
                    footer_tagline: "开源 · 简约 · 不凡",
                    app_name: "Buge App Manager",
                    app_desc: "强大的安卓应用和权限管理工具 (需要 Shizuku)。专业级应用管理。"
                }
            };

            let currentLang = 'en';
            const container = document.getElementById('softwaresContainer');

            // 生成卡片HTML，使用 data-i18n 动态绑定，并且卡片整体点击跳转至 website 字段 (appmanager专用)
            function buildCardsHTML() {
                let html = '';
                for (let sw of softwaresList) {
                    // 处理图标: 如果有图片则图片，否则显示 fallback icon
                    const hasImage = sw.iconImg ? true : false;
                    html += `
                        <div class="software-card" data-software-id="${sw.id}" data-website="${sw.website || '#'}">
                            <div class="card-icon">
                                ${hasImage ? `<img src="${sw.iconImg}" alt="${sw.id}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` : ''}
                                <i class="${sw.fallbackIcon} fallback-icon-inner" ${!hasImage ? 'style="display:flex;"' : 'style="display:none;"'}></i>
                            </div>
                            <h3 class="sw-name" data-i18n="${sw.nameKey}">${translations.en[sw.nameKey] || sw.nameKey}</h3>
                            <div class="description" data-i18n="${sw.descKey}">${translations.en[sw.descKey] || sw.descKey}</div>
                            <div class="button-container">
                                <a href="${sw.github}" target="_blank" class="card-link github-link" onclick="event.stopPropagation();"><i class="fab fa-github"></i> GitHub</a>
                                <a href="${sw.downloadUrl}" target="_blank" class="card-link download-link" onclick="event.stopPropagation();"><i class="fas fa-download"></i> Download</a>
                            </div>
                        </div>
                    `;
                }
                return html;
            }

            function updateAllTexts(lang) {
                if (!translations[lang]) return;
                // 更新所有带data-i18n属性的元素 (包括静态和动态生成的卡片内)
                const elements = document.querySelectorAll('[data-i18n]');
                elements.forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (translations[lang][key] !== undefined) {
                        el.innerText = translations[lang][key];
                    }
                });
                // 额外更新品牌名称
                const brandSpan = document.querySelector('.nav-logo span:not(.fallback-emoji)');
                if (brandSpan && translations[lang].brand) brandSpan.innerText = translations[lang].brand;
                currentLang = lang;
            }

            // 首次渲染卡片
            container.innerHTML = buildCardsHTML();

            // 处理卡片点击: 点击整个卡片跳转至对应的 website (Buge App Manager 跳转 https://bugestudioteam.github.io/appmanager)
            const attachCardClick = () => {
                const cards = document.querySelectorAll('.software-card');
                cards.forEach(card => {
                    // 移除原有监听器，重新绑定
                    const newCard = card.cloneNode(true);
                    card.parentNode.replaceChild(newCard, card);
                    const websiteUrl = newCard.getAttribute('data-website');
                    if (websiteUrl && websiteUrl !== '#') {
                        newCard.addEventListener('click', (e) => {
                            // 防止点到内部链接时冒泡导致双重跳转
                            if (e.target.closest('.card-link')) return;
                            window.location.href = websiteUrl;
                        });
                    }
                    // 重新绑定图片错误处理
                    const cardImg = newCard.querySelector('.card-icon img');
                    if (cardImg) {
                        cardImg.addEventListener('error', function() {
                            this.style.display = 'none';
                            const parentIcon = this.parentNode;
                            const fallbackIconElem = parentIcon.querySelector('.fallback-icon-inner');
                            if (fallbackIconElem) fallbackIconElem.style.display = 'flex';
                        });
                    }
                    // 重新绑定按钮事件防止冒泡（按钮本身已经带有 onclick event.stopPropagation，但确保重新绑定后依然有效）
                    const btns = newCard.querySelectorAll('.card-link');
                    btns.forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                        });
                    });
                });
            };

            attachCardClick();

            // 语言切换器逻辑 (保留活动状态)
            const langOptions = document.querySelectorAll('.lang-option');
            langOptions.forEach(opt => {
                opt.addEventListener('click', function() {
                    langOptions.forEach(o => o.classList.remove('active'));
                    this.classList.add('active');
                    const newLang = this.getAttribute('data-lang');
                    updateAllTexts(newLang);
                    // 更新完文本后需要重新绑定卡片点击（因为卡片被重新生成? 但updateAllTexts没有改变DOM结构，仅仅改变文本内容，卡片依然是原来的卡片，所以不需要重新attach）
                    // 但是安全起见，如果未来文本改变可能涉及到卡片内数据？不需要重新绑定，卡片已经存在
                });
            });

            // 强制默认英文 (根据需求: 默认英文)
            // 确保初始为英文，同时如果有浏览器语言偏好也不覆盖，但为了保证默认英文，直接设置语言为en并更新active样式
            const setDefaultEnglish = () => {
                const enOption = document.querySelector('.lang-option[data-lang="en"]');
                if (enOption && !enOption.classList.contains('active')) {
                    langOptions.forEach(o => o.classList.remove('active'));
                    enOption.classList.add('active');
                    updateAllTexts('en');
                } else if (enOption && enOption.classList.contains('active')) {
                    updateAllTexts('en');
                } else {
                    updateAllTexts('en');
                }
            };
            setDefaultEnglish();

            // 额外确保导航栏点击 logo 和标题跳转到 https://bugestudioteam.github.io
            const navLogo = document.querySelector('.nav-logo');
            if (navLogo) {
                navLogo.addEventListener('click', (e) => {
                    // 防止冒泡
                    e.preventDefault();
                    window.location.href = 'https://bugestudioteam.github.io';
                });
            }

            // 滚动渐现效果（继承主页风格）
            const fadeElements = document.querySelectorAll('.fade-out');
            function checkFade() {
                const windowHeight = window.innerHeight;
                fadeElements.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    const visiblePart = Math.min(1, (rect.top + rect.height) / windowHeight, (windowHeight - rect.top) / windowHeight);
                    if (visiblePart > 0.2) {
                        el.classList.add('visible');
                        el.classList.remove('hidden');
                    } else {
                        el.classList.remove('visible');
                        el.classList.add('hidden');
                    }
                });
            }
            window.addEventListener('scroll', checkFade);
            window.addEventListener('resize', checkFade);
            checkFade();

            // 导航栏图标优雅处理
            const navIcon = document.getElementById('navIcon');
            if (navIcon) {
                navIcon.onerror = function() {
                    this.style.display = 'none';
                    const fallbackSpan = document.querySelector('.nav-logo .fallback-emoji');
                    if (fallbackSpan) {
                        fallbackSpan.style.display = 'block';
                        fallbackSpan.textContent = '⚡';
                    }
                };
            }

            // 再次确保卡片点击跳转正确 (由于卡片在语言切换后未重新生成，但最开始已经attach过，如果用户切换语言不会影响卡片跳转地址，不需要二次attach)
            // 但安全起见再次确保所有卡片具有跳转能力，并且只针对app manager卡片跳转到指定地址
            const finalizeCardLinks = () => {
                const allCards = document.querySelectorAll('.software-card');
                allCards.forEach(card => {
                    const existingListener = card.getAttribute('data-listener');
                    if (!existingListener) {
                        const url = card.getAttribute('data-website');
                        if (url && url !== '#') {
                            const clickHandler = (e) => {
                                if (e.target.closest('.card-link')) return;
                                window.location.href = url;
                            };
                            card.addEventListener('click', clickHandler);
                            card.setAttribute('data-listener', 'true');
                        }
                    }
                });
            };
            finalizeCardLinks();
            
            // 额外处理按钮冒泡 (确保卡片点击时，按钮点击不触发卡片跳转)
            document.querySelectorAll('.card-link').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                });
            });
        })();
    </script>
</body>
</html>
