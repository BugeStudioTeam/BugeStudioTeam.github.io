name: Update App Manager

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest release
        id: rel
        run: |
          DATA=$(curl -s https://api.github.com/repos/BugeStudioTeam/Buge-App-Manager/releases/latest)
          TAG=$(echo "$DATA" | jq -r '.tag_name')
          VER=$(echo "$TAG" | sed 's/^AppManager//; s/^v//')
          APK_URL=$(echo "$DATA" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n1)
          APK_NAME=$(echo "$DATA" | jq -r '.assets[] | select(.name | endswith(".apk")) | .name' | head -n1)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Read current version
        id: cur
        run: |
          VER=$(grep -o 'appmanager/[0-9]*\.[0-9]*\.[0-9]*' index.html | head -n1 | cut -d'/' -f2)
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: cmp
        run: |
          if [ "${{ steps.rel.outputs.version }}" != "${{ steps.cur.outputs.version }}" ] && [ -n "${{ steps.rel.outputs.apk_url }}" ]; then
            echo "update=true" >> $GITHUB_OUTPUT
          else
            echo "update=false" >> $GITHUB_OUTPUT
          fi

      - name: Replace version references
        if: steps.cmp.outputs.update == 'true'
        run: |
          OLD="${{ steps.cur.outputs.version }}"
          NEW="${{ steps.rel.outputs.version }}"
          for f in index.html softwares/index.html appmanager/index.html \
                   de-DE/index.html de-DE/softwares/index.html de-DE/appmanager/index.html \
                   re-RU/index.html re-RU/softwares/index.html re-RU/appmanager/index.html \
                   zh-CN/index.html zh-CN/softwares/index.html zh-CN/appmanager/index.html; do
            if [ -f "$f" ]; then
              sed -i "s|$OLD|$NEW|g" "$f"
            fi
          done

      - name: Clean old storage
        if: steps.cmp.outputs.update == 'true'
        run: |
          rm -rf storage/appmanager/*
          mkdir -p "storage/appmanager/${{ steps.rel.outputs.version }}"

      - name: Download APK
        if: steps.cmp.outputs.update == 'true'
        run: |
          curl -L -o "storage/appmanager/${{ steps.rel.outputs.version }}/${{ steps.rel.outputs.apk_name }}" "${{ steps.rel.outputs.apk_url }}"

      - name: Commit and push
        if: steps.cmp.outputs.update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Buge App Manager to ${{ steps.rel.outputs.version }}"
          git push