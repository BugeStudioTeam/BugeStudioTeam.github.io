    <style>
        :root {
            --bg-dark: #0b1321;
            --bg-light: #f4f9ff;
            --text-main: #0a1e3c;
            --accent-blue: #1e88e5;
            --card-bg: rgba(255,255,255,0.7);
            --nav-bg: rgba(255,255,255,0.75);
            --border-color: rgba(30,136,229,0.2);
            --shadow-color: rgba(0,40,100,0.15);
            --github-green: #2e7d32;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-dark: #030c17;
                --bg-light: #0d1a2b;
                --text-main: #e0edff;
                --card-bg: rgba(15,30,45,0.8);
                --nav-bg: rgba(8,18,33,0.9);
                --border-color: rgba(100,181,246,0.2);
                --shadow-color: rgba(0,0,0,0.4);
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 30% 10%, var(--bg-light), var(--bg-dark));
            background-repeat: no-repeat;
            background-attachment: scroll;
            background-size: cover;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            /* Flexbox ensures the footer stays at the bottom */
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        /* --- Animations --- */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.6s cubic-bezier(0.15, 0.45, 0.37, 1);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
        /* Navigation */
        .global-nav {
            position: fixed;
            top: 24px;
            left: 5%;
            right: 5%;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 80px;
            padding: 10px 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px var(--shadow-color);
            z-index: 100;
        }
        .nav-logo { display: flex; align-items: center; gap: 12px; }
        .nav-logo img { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; }
        .nav-logo span { font-size: 1.2rem; font-weight: 800; color: var(--accent-blue); }
        .lang-switch { display: flex; gap: 4px; background: rgba(0,0,0,0.05); padding: 4px; border-radius: 30px; }
        .lang-option {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
            color: var(--text-main);
            text-decoration: none;
        }
        .lang-option.active { background: var(--accent-blue); color: white; pointer-events: none; }
        /* Main Content wrapper */
        main { 
            flex: 1; /* This fills the available space to push footer down */
            padding-top: 140px; 
            width: 90%; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .hero {
            padding: 60px 0 80px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hero-icon {
            width: 160px;
            height: 160px;
            border-radius: 40px;
            margin-bottom: 35px;
            box-shadow: 0 25px 50px -12px var(--shadow-color);
            object-fit: cover;
        }
        .hero-title {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), #90caf9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 15px;
        }
        .hero-sub {
            font-size: 1.4rem;
            opacity: 0.85;
            max-width: 750px;
            margin-bottom: 45px;
        }
        .btn-group { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .btn {
            padding: 16px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.3s;
        }
        .btn-primary { background: var(--github-green); color: white; }
        .btn-secondary { background: var(--accent-blue); color: white; }
        .btn:hover { transform: translateY(-3px); }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin: 60px 0 100px;
        }
        .feature-card {
            background: var(--card-bg);
            padding: 50px 40px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
        }
        .feature-card h3 { font-size: 1.8rem; margin-bottom: 18px; color: var(--accent-blue); font-weight: 700; }
        .feature-card p { font-size: 1.15rem; opacity: 0.8; }
        /* Footer always at the bottom */
        footer {
            padding: 60px 0 40px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            width: 100%;
        }
        footer p {
            color: #ffffff !important; 
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }
        @media (max-width: 600px) {
            .btn { width: 100%; justify-content: center; }
            .global-nav { flex-direction: column; gap: 12px; border-radius: 30px; padding: 15px; }
            main { padding-top: 180px; }
        }
    </style>
</head>

    <script>
        (function() {
            /* --- Scroll Reveal Logic --- */
            const fadeElements = document.querySelectorAll('.reveal');
            function checkFade() {
                const windowHeight = window.innerHeight;
                fadeElements.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if (rect.top < windowHeight - 50) {
                        el.classList.add('visible');
                    }
                });
            }
            window.addEventListener('scroll', checkFade);
            window.addEventListener('resize', checkFade);
            setTimeout(checkFade, 100);
        })();
    </script>
