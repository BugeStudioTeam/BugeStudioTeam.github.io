<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Buge Studio - 支持我们</title>
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* ---------- Reuse original variables ---------- */
        :root {
            --bg-dark: #0b1321; --bg-light: #f4f9ff;
            --text-dark: #0a1e3c; --accent-blue: #1e88e5;
            --accent-soft: #64b5f6; --card-bg-light: rgba(255,255,255,0.7);
            --nav-bg-light: rgba(255,255,255,0.75);
            --border-light: rgba(30,136,229,0.2); --shadow-color: rgba(0,40,100,0.2);
            --paypal-blue: #003087;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-dark: #030c17; --bg-light: #0d1a2b;
                --text-dark: #e0edff; --card-bg-light: rgba(15,30,45,0.8);
                --nav-bg-dark: rgba(8,20,35,0.85);
                --shadow-color: rgba(0,20,60,0.6);
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 30% 10%, var(--bg-light), var(--bg-dark));
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* Ensure footer stays at bottom */
            transition: background 0.3s;
            overflow-x: hidden;
        }
        /* ----- Original navigation bar ----- */
        .global-nav {
            position: fixed; top: 24px; left: 5%; right: 5%;
            max-width: 1400px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--nav-bg-light); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 80px; padding: 12px 28px;
            border: 1px solid var(--border-light);
            box-shadow: 0 20px 40px var(--shadow-color); z-index: 100;
        }
        @media (prefers-color-scheme: dark) { .global-nav { background: var(--nav-bg-dark); } }
        .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .nav-logo img { width: 44px; height: 44px; border-radius: 16px; filter: none; }
        .nav-logo span { 
            font-size: 2rem; font-weight: 800; letter-spacing: -1px;
            background: linear-gradient(135deg, var(--accent-blue), #90caf9);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        /* Language switcher */
        .lang-switch { display: flex; gap: 6px; background: rgba(128,128,128,0.1); padding: 4px; border-radius: 40px; }
        .lang-option { padding: 6px 14px; border-radius: 32px; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-dark); transition: 0.2s; text-decoration: none; }
        .lang-option.active { background: var(--accent-blue); color: white; pointer-events: none; }
        /* Main content */
        main { flex: 1; padding-top: 160px; width: 90%; max-width: 1000px; margin: 0 auto; text-align: center; }
        .hero-title { 
            font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 800; margin-bottom: 20px; letter-spacing: -2px;
            background: linear-gradient(145deg, var(--accent-blue), #bbdefb);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .hero-sub { font-size: 1.3rem; opacity: 0.8; margin-bottom: 50px; line-height: 1.5; max-width: 800px; margin-left: auto; margin-right: auto; }
        /* Payment method selector buttons */
        .selector-container {
            display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 40px;
        }
        .select-btn {
            padding: 16px 32px; border-radius: 50px; border: 2px solid var(--border-light);
            background: var(--card-bg-light); color: var(--text-dark);
            font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; gap: 12px; font-size: 1.15rem;
        }
        .select-btn:hover { transform: translateY(-4px); border-color: var(--accent-blue); box-shadow: 0 10px 20px var(--shadow-color); }
        .select-btn.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); box-shadow: 0 12px 24px rgba(30,136,229,0.3); }
        /* Display area */
        .display-area {
            min-height: 450px; position: relative;
            background: var(--card-bg-light); backdrop-filter: blur(24px);
            border-radius: 60px; padding: 60px 40px;
            border: 2px solid var(--border-light);
            box-shadow: 0 40px 80px -20px var(--shadow-color);
            margin-bottom: 100px;
            display: flex; align-items: center; justify-content: center;
        }
        .method-content {
            display: none; flex-direction: column; align-items: center; animation: slideUp 0.5s ease-out; width: 100%;
        }
        .method-content.active { display: flex; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .qr-box {
            width: 280px; height: 280px; background: white; border-radius: 30px;
            padding: 18px; margin: 30px 0; box-shadow: 0 20px 40px rgba(0,0,0,0.12);
        }
        .qr-box img { width: 100%; height: 100%; object-fit: contain; }
        .paypal-btn {
            padding: 22px 64px; background: linear-gradient(135deg, var(--paypal-blue), #0070ba); color: white;
            border-radius: 60px; text-decoration: none; font-weight: 800;
            font-size: 1.5rem; margin-top: 20px; display: inline-block;
            box-shadow: 0 15px 30px rgba(0,48,135,0.3); transition: 0.3s;
        }
        .paypal-btn:hover { transform: scale(1.05) translateY(-2px); box-shadow: 0 20px 40px rgba(0,48,135,0.4); }
        /* ----- Original copyright style (always at bottom) ----- */
        footer {
            margin-top: auto; /* Key: push to bottom */
            padding: 50px 0;
            text-align: center;
            border-top: 1px solid var(--border-light);
        }
        footer p {
            color: #ffffff !important;
            font-size: 1.1rem;
            font-weight: 400;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        @media (max-width: 600px) {
            .select-btn { width: 100%; justify-content: center; }
            .hero-title { font-size: 2.8rem; }
            .display-area { padding: 40px 20px; border-radius: 40px; }
        }
    </style>
</head>
<body>
    <nav class="global-nav">
        <a href="https://bugestudioteam.github.io/zh-CN" class="nav-logo">
            <img src="icon.png" alt="Buge Studio">
            <span>Buge Studio</span>
        </a>
        <div class="lang-switch">
            <a href="https://bugestudioteam.github.io/support" class="lang-option">EN</a>
            <a href="https://bugestudioteam.github.io/de-DE/support" class="lang-option">DE</a>
            <a href="https://bugestudioteam.github.io/re-RU/support" class="lang-option">RU</a>
            <span class="lang-option active">中文</span>
        </div>
    </nav>
    <main>
        <h1 class="hero-title">支持 Buge Studio</h1>
        <p class="hero-sub">请选择您偏好的支付方式，您的支持是保持软件开源和免费的动力。</p>
        <div class="selector-container">
            <button id="btn-paypal" class="select-btn active" onclick="showMethod('paypal', this)">
                <i class="fab fa-paypal"></i> PayPal
            </button>
            <button id="btn-wechat" class="select-btn" onclick="showMethod('wechat', this)">
                <i class="fab fa-weixin"></i> 微信支付
            </button>
            <button id="btn-alipay" class="select-btn" onclick="showMethod('alipay', this)">
                <i class="fab fa-alipay"></i> 支付宝
            </button>
        </div>
        <div class="display-area">
            <div id="paypal" class="method-content active">
                <h3 style="font-size: 2rem;">通过 PayPal 支付</h3>
                <p style="margin-top:15px; font-size: 1.2rem; opacity: 0.8;">支持国际信用卡及 PayPal 余额支付</p>
                <a href="https://www.paypal.com/paypalme/creepynightmares" target="_blank" class="paypal-btn">
                    <i class="fab fa-paypal"></i> PayPal
                </a>
            </div>
            <div id="wechat" class="method-content">
                <h3 style="font-size: 2rem;">通过微信支付</h3>
                <div class="qr-box">
                    <img src="wechat_qr.png" alt="微信支付二维码">
                </div>
                <p style="font-size: 1.1rem; opacity: 0.8;">请使用手机 App 扫描二维码</p>
            </div>
            <div id="alipay" class="method-content">
                <h3 style="font-size: 2rem;">通过支付宝支付</h3>
                <div class="qr-box">
                    <img src="alipay_qr.png" alt="支付宝二维码">
                </div>
                <p style="font-size: 1.1rem; opacity: 0.8;">请使用手机 App 扫描二维码</p>
            </div>
        </div>
    </main>
    <footer>
        <p>© 2026 Buge Studio</p>
    </footer>
    <script>
        // Payment method switching function
        function showMethod(methodId, btn) {
            document.querySelectorAll('.method-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.select-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(methodId).classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>
</html>
