<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buge Store - App Detail</title>
    <link rel="icon" href="/store/icon.png" type="image/png" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f7;
            color: #1c1c1e;
            min-height: 100vh;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0 16px;
            border-bottom: 1px solid #e5e5ea;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header .logo a {
            color: #1c1c1e;
            text-decoration: none;
        }

        .banner-container {
            margin-bottom: 24px;
            border-radius: 16px;
            overflow: hidden;
            background: #f0f0f5;
            max-height: 300px;
            display: none;
        }

        .banner-container img {
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: cover;
            display: block;
        }

        .banner-container.has-banner {
            display: block;
        }

        .detail-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 32px 32px 28px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f0f5;
        }

        .detail-top {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .detail-icon {
            width: 100px;
            height: 100px;
            border-radius: 22px;
            background: #f7f7fa;
            object-fit: cover;
            border: 1px solid #e5e5ea;
            flex-shrink: 0;
        }

        .detail-top-right {
            flex: 1;
            min-width: 200px;
        }

        .detail-name {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 2px;
            letter-spacing: -0.5px;
        }

        .detail-package {
            font-size: 15px;
            color: #8e8e93;
            font-family: monospace;
            margin-bottom: 4px;
        }

        .detail-developer {
            font-size: 15px;
            color: #8e8e93;
            margin-bottom: 10px;
        }

        .detail-stars-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .detail-stars-row .star-icon {
            font-size: 20px;
            color: #f5a623;
        }

        .detail-stars-row .star-count {
            font-size: 14px;
            color: #8e8e93;
        }

        .detail-categories {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .detail-categories span {
            font-size: 13px;
            background: #f0f0f5;
            padding: 4px 16px;
            border-radius: 14px;
            color: #3a3a3c;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px 20px;
            background: #f7f7fa;
            padding: 18px 22px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .detail-grid .label {
            color: #8e8e93;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .detail-grid .value {
            font-weight: 500;
            word-break: break-all;
        }

        .detail-description {
            margin-bottom: 20px;
        }

        .detail-description .desc-label {
            font-size: 13px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }

        .detail-description p {
            font-size: 15px;
            line-height: 1.8;
            color: #3a3a3c;
            white-space: pre-wrap;
        }

        .detail-changelog {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f5;
        }

        .detail-changelog .changelog-label {
            font-size: 13px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }

        .detail-changelog pre {
            white-space: pre-wrap;
            font-family: inherit;
            font-size: 14px;
            color: #3a3a3c;
            background: #f7f7fa;
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 4px;
            line-height: 1.7;
        }

        .detail-download-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        .detail-download-btn {
            flex: 1;
            min-width: 180px;
            text-align: center;
            padding: 16px 24px;
            background: #1c1c1e;
            color: #ffffff;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 17px;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
        }

        .detail-download-btn:hover {
            background: #3a3a3c;
        }

        .detail-download-btn .size-hint {
            font-weight: 400;
            font-size: 13px;
            opacity: 0.7;
            display: block;
            margin-top: 2px;
        }

        .detail-meta-links {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .detail-meta-links a {
            font-size: 14px;
            color: #007aff;
            text-decoration: none;
        }

        .detail-meta-links a:hover {
            text-decoration: underline;
        }

        .detail-extra {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 20px;
            background: #f7f7fa;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 13px;
            margin-top: 12px;
        }

        .detail-extra .label {
            color: #8e8e93;
        }

        .detail-extra .value {
            font-weight: 500;
            text-align: right;
            word-break: break-all;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            font-size: 16px;
            color: #8e8e93;
        }

        .error {
            text-align: center;
            padding: 80px 20px;
            color: #c2352b;
            background: #fef0ef;
            border-radius: 16px;
            margin: 20px 0;
        }

        .error button {
            margin-top: 14px;
            padding: 10px 28px;
            border-radius: 10px;
            border: 1px solid #d2d2d7;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        .footer {
            margin-top: 44px;
            padding: 24px 0 16px;
            border-top: 1px solid #e5e5ea;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 13px;
            color: #8e8e93;
        }

        .footer a {
            color: #007aff;
            text-decoration: none;
        }

        .footer .footer-links {
            display: flex;
            gap: 20px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 0 16px;
            }
            .detail-card {
                padding: 20px 16px 20px;
            }
            .detail-top {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .detail-icon {
                width: 80px;
                height: 80px;
            }
            .detail-name {
                font-size: 24px;
            }
            .detail-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px 16px;
                padding: 14px 16px;
            }
            .detail-grid .value {
                text-align: right;
            }
            .detail-extra {
                grid-template-columns: 1fr;
                gap: 2px 0;
            }
            .detail-extra .value {
                text-align: left;
                margin-bottom: 4px;
            }
            .detail-stars-row {
                justify-content: center;
            }
            .detail-categories {
                justify-content: center;
            }
            .detail-download-section {
                flex-direction: column;
            }
            .detail-download-btn {
                width: 100%;
            }
            .detail-meta-links {
                justify-content: center;
            }
            .footer {
                flex-direction: column;
                text-align: center;
            }
            .footer .footer-links {
                justify-content: center;
            }
            .header .logo {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div class="header">
            <div class="logo"><a href="/store/">Buge Store</a></div>
        </div>

        <div id="detailContent">
            <div class="loading">Loading...</div>
        </div>

        <div class="footer">
            <span>Powered by <a href="https://github.com/BugeStudioTeam/Buge-Store-API" target="_blank">Buge Store API</a></span>
            <div class="footer-links">
                <a href="https://github.com/BugeStudioTeam/Buge-Store-API" target="_blank">GitHub</a>
                <a href="/store/">Store</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // Buge Store - Detail Page with Real GitHub Stars & Downloads
        // ============================================================

        const API_URL =
            "https://raw.githubusercontent.com/BugeStudioTeam/Buge-Store-API/main/api/v1/apps.json";

        const detailEl = document.getElementById("detailContent");

        function getPackageFromQuery() {
            const params = new URLSearchParams(window.location.search);
            return params.get('package');
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            try {
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            } catch {
                return dateStr;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderDescription(text) {
            if (!text) return '';
            return escapeHtml(text).replace(/\n/g, '<br />');
        }

        async function fetchGitHubStars(repoUrl) {
            if (!repoUrl) return null;
            const match = repoUrl.match(/github\.com\/([^\/]+)\/([^\/]+)/);
            if (!match) return null;
            const owner = match[1];
            const repo = match[2].replace('.git', '');
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${owner}/${repo}`,
                    {
                        headers: {
                            'Accept': 'application/vnd.github.v3+json',
                            'User-Agent': 'Buge-Store-Client'
                        }
                    }
                );
                if (!response.ok) return null;
                const data = await response.json();
                return data.stargazers_count || 0;
            } catch (error) {
                console.error('GitHub API error:', error);
                return null;
            }
        }

        async function fetchGitHubDownloads(repoUrl) {
            if (!repoUrl) return null;
            const match = repoUrl.match(/github\.com\/([^\/]+)\/([^\/]+)/);
            if (!match) return null;
            const owner = match[1];
            const repo = match[2].replace('.git', '');
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${owner}/${repo}/releases`,
                    {
                        headers: {
                            'Accept': 'application/vnd.github.v3+json',
                            'User-Agent': 'Buge-Store-Client'
                        }
                    }
                );
                if (!response.ok) return null;
                const releases = await response.json();
                let totalDownloads = 0;
                for (const release of releases) {
                    if (release.assets) {
                        for (const asset of release.assets) {
                            totalDownloads += asset.download_count || 0;
                        }
                    }
                }
                return totalDownloads;
            } catch (error) {
                console.error('GitHub API error:', error);
                return null;
            }
        }

        async function loadDetail() {
            const packageName = getPackageFromQuery();

            if (!packageName) {
                detailEl.innerHTML = `
                        <div class="error">
                            No app specified.<br />
                            <button onclick="window.location.href='/store/'">Go to Store</button>
                        </div>
                    `;
                return;
            }

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const apps = data.apps || [];

                const seen = new Set();
                let app = null;
                for (const a of apps) {
                    if (a.package === packageName && !seen.has(a.package)) {
                        seen.add(a.package);
                        app = a;
                        break;
                    }
                }

                if (!app) {
                    detailEl.innerHTML = `
                            <div class="error">
                                App not found.<br />
                                <button onclick="window.location.href='/store/'">Back to Store</button>
                            </div>
                        `;
                    return;
                }

                document.title = `${app.name} - Buge Store`;

                let starCount = '...';
                let downloadsDisplay = '...';
                let downloadsLabel = 'Downloads';

                if (app.source_code) {
                    const [stars, downloads] = await Promise.all([
                        fetchGitHubStars(app.source_code),
                        fetchGitHubDownloads(app.source_code)
                    ]);
                    starCount = stars !== null ? formatNumber(stars) : '?';
                    if (downloads !== null) {
                        downloadsDisplay = formatNumber(downloads);
                        downloadsLabel = 'Downloads (GitHub)';
                    } else {
                        downloadsDisplay = app.downloads || 0;
                    }
                } else {
                    starCount = '0';
                    downloadsDisplay = app.downloads || 0;
                }

                const bannerHtml = app.banner ? `
                        <div class="banner-container has-banner">
                            <img src="${app.banner}" alt="${app.name} banner" onerror="this.parentElement.style.display='none'" />
                        </div>
                    ` : '';

                const changelog = app.changelog || 'No changelog provided.';
                const description = app.description || '';
                const architectures = (app.architectures || []).join(', ');

                detailEl.innerHTML = `
                        ${bannerHtml}
                        <div class="detail-card">
                            <div class="detail-top">
                                <img
                                    class="detail-icon"
                                    src="${app.icon || ''}"
                                    alt="${app.name}"
                                    onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23f0f0f5%22/%3E%3Ctext x=%2250%22 y=%2262%22 text-anchor=%22middle%22 font-size=%2246%22 fill=%22%238e8e93%22%3E📦%3C/text%3E%3C/svg%3E'"
                                />
                                <div class="detail-top-right">
                                    <div class="detail-name">${escapeHtml(app.name)}</div>
                                    <div class="detail-package">${escapeHtml(app.package)}</div>
                                    <div class="detail-developer">${escapeHtml(app.developer || 'Unknown developer')}</div>
                                    <div class="detail-stars-row">
                                        <span class="star-icon">★</span>
                                        <span class="star-count">${starCount} stars</span>
                                    </div>
                                    <div class="detail-categories">
                                        ${(app.categories || []).map(c =>
                                            `<span>${escapeHtml(c)}</span>`
                                        ).join('')}
                                    </div>
                                </div>
                            </div>

                            <div class="detail-grid">
                                <div>
                                    <div class="label">Version</div>
                                    <div class="value">${escapeHtml(app.latest_version || '-')}</div>
                                </div>
                                <div>
                                    <div class="label">Size</div>
                                    <div class="value">${app.size_mb ? app.size_mb + ' MB' : '-'}</div>
                                </div>
                                <div>
                                    <div class="label">Min SDK</div>
                                    <div class="value">${app.min_sdk || '-'}</div>
                                </div>
                                <div>
                                    <div class="label">Target SDK</div>
                                    <div class="value">${app.target_sdk || app.targetSdk || '-'}</div>
                                </div>
                                <div>
                                    <div class="label">Updated</div>
                                    <div class="value">${formatDate(app.release_date || app.updated || '')}</div>
                                </div>
                                <div>
                                    <div class="label">${downloadsLabel}</div>
                                    <div class="value">${downloadsDisplay}</div>
                                </div>
                            </div>

                            ${description ? `
                                <div class="detail-description">
                                    <div class="desc-label">About</div>
                                    <p>${renderDescription(description)}</p>
                                </div>
                            ` : ''}

                            <div class="detail-changelog">
                                <div class="changelog-label">What's New</div>
                                <pre>${escapeHtml(changelog)}</pre>
                            </div>

                            <div class="detail-download-section">
                                <a class="detail-download-btn" href="${app.download_url || '#'}" target="_blank" rel="noopener noreferrer">
                                    Download APK
                                    <span class="size-hint">${app.size_mb ? app.size_mb + ' MB' : ''}</span>
                                </a>
                                <div class="detail-meta-links">
                                    ${app.source_code ? `<a href="${app.source_code}" target="_blank">Source Code</a>` : ''}
                                    ${app.website ? `<a href="${app.website}" target="_blank">Website</a>` : ''}
                                </div>
                            </div>

                            <div class="detail-extra">
                                <span class="label">Signature</span>
                                <span class="value" style="font-family:monospace;font-size:12px;">${escapeHtml(app.signature || '-')}</span>
                                <span class="label">Package</span>
                                <span class="value" style="font-family:monospace;">${escapeHtml(app.package)}</span>
                                ${architectures ? `
                                    <span class="label">Architectures</span>
                                    <span class="value">${escapeHtml(architectures)}</span>
                                ` : ''}
                                ${app.short_description ? `
                                    <span class="label">Tagline</span>
                                    <span class="value" style="font-style:italic;">${escapeHtml(app.short_description)}</span>
                                ` : ''}
                            </div>
                        </div>
                    `;

            } catch (error) {
                console.error("Load error:", error);
                detailEl.innerHTML = `
                        <div class="error">
                            Failed to load app details.<br />
                            <small>${error.message}</small><br />
                            <button onclick="loadDetail()">Retry</button>
                        </div>
                    `;
            }
        }

        loadDetail();
    </script>

</body>
</html>
