<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buge Store - App Detail</title>
  
  <link rel="icon" href="icon.png" type="image/png" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <link rel="stylesheet" href="styles/style.css" />
  <style>
    .detail-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .detail-card {
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      border-radius: 28px;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .detail-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .meta-item {
      background-color: var(--md-sys-color-surface);
      padding: 1rem;
      border-radius: 16px;
    }
    .meta-item .label {
      font-size: 0.8rem;
      color: var(--md-sys-color-on-surface-variant);
      display: block;
      margin-bottom: 0.25rem;
    }
    .meta-item .value {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
    }
  </style>
</head>
<body>

  <main class="container detail-container">

    <header class="hero" style="padding: 1.5rem 0 1rem;">
      <div style="display: flex; align-items: center; justify-content: flex-start; width: 100%; margin-bottom: 1rem;">
        <a href="index.html" class="btn btn-outlined" style="padding: 0.5rem 1rem; font-size: 0.9rem;">
          <span class="material-symbols-outlined">arrow_back</span>
          Back to Store
        </a>
      </div>
      <div class="wavy-line" style="margin-top: 0.5rem;"></div>
    </header>

    <section id="app-detail">
      <div class="detail-card" style="text-align: center; color: var(--md-sys-color-on-surface-variant);">
        Loading app details...
      </div>
    </section>

    <div class="social-row">
      <a href="https://github.com/BugeStudioTeam" class="btn-icon" rel="noopener" aria-label="GitHub">
        <svg class="custom-icon" viewBox="0 0 24 24">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </a>

      <a href="https://t.me/bugestudio" class="btn-icon" rel="noopener" aria-label="Telegram">
        <svg class="custom-icon" viewBox="0 0 24 24">
          <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.831-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
        </svg>
      </a>

      <a href="mailto:CreepyNightmares@proton.me" class="btn-icon" aria-label="Email">
        <svg class="custom-icon" viewBox="0 0 24 24">
          <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
      </a>
    </div>

  </main>

  <footer>
    <div class="footer-content">
      <div class="copyright">
        © 2026 Buge Studio
      </div>

      <div class="footer-controls">
        <div class="md3-dropdown-container" id="langDropdownContainer">
          <div class="md3-dropdown-trigger" onclick="toggleDropdown('langDropdownContainer')">
            <div class="md3-dropdown-info">
              <span class="md3-dropdown-label">Language</span>
              <span class="md3-dropdown-value" id="selectedLangText">English</span>
            </div>
            <span class="material-symbols-outlined md3-dropdown-icon">arrow_drop_down</span>
          </div>
          <div class="md3-dropdown-menu">
            <div class="md3-menu-item selected" onclick="selectLanguage('English', 'https://bugestudio.website/store/detail.html', this)">
              <span>English</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectLanguage('Deutsch', 'https://bugestudio.website/de-DE/store/detail.html', this)">
              <span>Deutsch</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectLanguage('Русский', 'https://bugestudio.website/re-RU/store/detail.html', this)">
              <span>Русский</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectLanguage('简体中文', 'https://bugestudio.website/zh-CN/store/detail.html', this)">
              <span>简体中文</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
          </div>
        </div>

        <div class="md3-dropdown-container" id="themeDropdownContainer">
          <div class="md3-dropdown-trigger" onclick="toggleDropdown('themeDropdownContainer')">
            <div class="md3-dropdown-info">
              <span class="md3-dropdown-label">Theme</span>
              <span class="md3-dropdown-value" id="selectedThemeText">Light</span>
            </div>
            <span class="material-symbols-outlined md3-dropdown-icon">arrow_drop_down</span>
          </div>
          <div class="md3-dropdown-menu">
            <div class="md3-menu-item selected" onclick="selectTheme('light', 'Light', this)">
              <span>Light</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectTheme('light-medium-contrast', 'Light (Medium)', this)">
              <span>Light (Medium)</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectTheme('light-high-contrast', 'Light (High)', this)">
              <span>Light (High)</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectTheme('dark', 'Dark', this)">
              <span>Dark</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectTheme('dark-medium-contrast', 'Dark (Medium)', this)">
              <span>Dark (Medium)</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectTheme('dark-high-contrast', 'Dark (High)', this)">
              <span>Dark (High)</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    async function loadDetail() {
      const detailEl = document.getElementById('app-detail');
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const appId = urlParams.get('id');
        if (!appId) {
          throw new Error("No app ID provided.");
        }

        const response = await fetch('apps.json');
        const apps = await response.json();
        const app = apps.find(item => item.id === appId);

        if (!app) {
          throw new Error("App not found.");
        }

        document.title = `${app.name} - Buge Store`;

        const architectures = (app.architectures || []).join(', ');

        detailEl.innerHTML = `
          <div class="detail-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">
              <div>
                <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 0.25rem;">${escapeHtml(app.name)}</h2>
                <p style="color: var(--md-sys-color-on-surface-variant); font-size: 0.95rem;">By ${escapeHtml(app.developer || 'Buge Studio')}</p>
              </div>
              <a href="${app.download_url || '#'}" target="_blank" class="btn btn-filled">
                <span class="material-symbols-outlined">download</span>
                Download v${escapeHtml(app.latest_version || '')}
              </a>
            </div>

            <p style="margin: 1.25rem 0; line-height: 1.6; color: var(--md-sys-color-on-surface);">
              ${escapeHtml(app.description || app.short_description || '')}
            </p>

            <div class="detail-meta-grid">
              <div class="meta-item">
                <span class="label">Latest Version</span>
                <span class="value">${escapeHtml(app.latest_version || '-')}</span>
              </div>
              <div class="meta-item">
                <span class="label">File Size</span>
                <span class="value">${app.size_mb || '-'} MB</span>
              </div>
              <div class="meta-item">
                <span class="label">Min SDK</span>
                <span class="value">Android ${app.min_sdk || '-'}</span>
              </div>
              ${app.target_sdk ? `
                <div class="meta-item">
                  <span class="label">Target SDK</span>
                  <span class="value">Android ${app.target_sdk}</span>
                </div>
              ` : ''}
              <div class="meta-item">
                <span class="label">Package Name</span>
                <span class="value" style="font-family: monospace; font-size: 0.85rem;">${escapeHtml(app.package || '-')}</span>
              </div>
              <div class="meta-item">
                <span class="label">Signature</span>
                <span class="value" style="font-family: monospace; font-size: 0.85rem;">${escapeHtml(app.signature || '-')}</span>
              </div>
              ${architectures ? `
                <div class="meta-item">
                  <span class="label">Architectures</span>
                  <span class="value">${escapeHtml(architectures)}</span>
                </div>
              ` : ''}
            </div>
          </div>
        `;

      } catch (error) {
        console.error("Load error:", error);
        detailEl.innerHTML = `
          <div class="detail-card" style="text-align: center;">
            <p style="color: var(--md-sys-color-error); font-weight: 500; margin-bottom: 0.5rem;">Failed to load app details.</p>
            <p style="font-size: 0.9rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 1.25rem;">${escapeHtml(error.message)}</p>
            <button class="btn btn-outlined" onclick="loadDetail()">Retry</button>
          </div>
        `;
      }
    }

    loadDetail();
  </script>
  <script src="js/main.js"></script>
</body>
</html>
