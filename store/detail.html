<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buge Store - App Detail</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f7f7fa;
            color: #1c1c1e;
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 24px;
            border-bottom: 1px solid #e5e5ea;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .header h1 a {
            color: #1c1c1e;
            text-decoration: none;
        }

        .header .back-link {
            font-size: 14px;
            color: #007aff;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 8px;
            background: #f0f7ff;
            transition: background 0.2s;
        }

        .header .back-link:hover {
            background: #e1efff;
        }

        .detail-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 32px 28px 28px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f0f5;
        }

        .detail-card .icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            background: #f7f7fa;
            object-fit: cover;
            border: 1px solid #e5e5ea;
            margin-bottom: 16px;
        }

        .detail-card .name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .detail-card .package {
            font-size: 15px;
            color: #8e8e93;
            font-family: monospace;
            margin-bottom: 4px;
        }

        .detail-card .developer {
            font-size: 15px;
            color: #8e8e93;
            margin-bottom: 18px;
        }

        .detail-card .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 20px;
            background: #f7f7fa;
            padding: 16px 20px;
            border-radius: 14px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .detail-card .detail-grid .label {
            color: #8e8e93;
        }

        .detail-card .detail-grid .value {
            font-weight: 500;
            text-align: right;
            word-break: break-all;
        }

        .detail-card .categories {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .detail-card .categories span {
            font-size: 13px;
            background: #f0f0f5;
            padding: 4px 16px;
            border-radius: 14px;
            color: #3a3a3c;
        }

        .detail-card .download-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 14px 0;
            background: #1c1c1e;
            color: #ffffff;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 17px;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
        }

        .detail-card .download-btn:hover {
            background: #3a3a3c;
        }

        .detail-card .changelog {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #e5e5ea;
        }

        .detail-card .changelog .changelog-title {
            font-weight: 500;
            color: #8e8e93;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }

        .detail-card .changelog pre {
            white-space: pre-wrap;
            font-family: inherit;
            font-size: 14px;
            color: #3a3a3c;
            background: #f7f7fa;
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 4px;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            font-size: 16px;
            color: #8e8e93;
        }

        .error {
            text-align: center;
            padding: 60px 20px;
            color: #c2352b;
            background: #fef0ef;
            border-radius: 16px;
            margin: 20px 0;
        }

        .error button {
            margin-top: 14px;
            padding: 10px 28px;
            border-radius: 10px;
            border: 1px solid #d2d2d7;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        .footer {
            margin-top: 44px;
            padding: 18px 0 6px;
            border-top: 1px solid #e5e5ea;
            text-align: center;
            font-size: 13px;
            color: #8e8e93;
        }

        .footer a {
            color: #007aff;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }
            .detail-card {
                padding: 22px 18px 20px;
            }
            .detail-card .name {
                font-size: 22px;
            }
            .detail-card .detail-grid {
                grid-template-columns: 1fr;
                gap: 2px 0;
            }
            .detail-card .detail-grid .value {
                text-align: left;
                margin-bottom: 4px;
            }
            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div class="header">
            <h1><a href="/">Buge Store</a></h1>
            <a class="back-link" href="/">← Back</a>
        </div>

        <div id="detailContent">
            <div class="loading">Loading...</div>
        </div>

        <div class="footer">
            Powered by <a href="https://github.com/BugeStudioTeam/Buge-Store-API" target="_blank">Buge Store API</a>
            &middot; Open source app index
        </div>
    </div>

    <script>
        const API_URL =
            "https://raw.githubusercontent.com/BugeStudioTeam/Buge-Store-API/main/api/v1/apps.json";

        const detailEl = document.getElementById("detailContent");

        function getPackageFromQuery() {
            const params = new URLSearchParams(window.location.search);
            return params.get('package');
        }

        async function loadDetail() {
            const packageName = getPackageFromQuery();

            if (!packageName) {
                detailEl.innerHTML = `
                        <div class="error">
                            No app specified.<br />
                            <button onclick="window.location.href='/'">Go to Store</button>
                        </div>
                    `;
                return;
            }

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const apps = data.apps || [];

                const seen = new Set();
                let app = null;
                for (const a of apps) {
                    if (a.package === packageName && !seen.has(a.package)) {
                        seen.add(a.package);
                        app = a;
                        break;
                    }
                }

                if (!app) {
                    detailEl.innerHTML = `
                            <div class="error">
                                App not found.<br />
                                <button onclick="window.location.href='/'">Back to Store</button>
                            </div>
                        `;
                    return;
                }

                document.title = `${app.name} - Buge Store`;

                detailEl.innerHTML = `
                        <div class="detail-card">
                            <img
                                class="icon"
                                src="${app.icon || ''}"
                                alt="${app.name}"
                                onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%23f0f0f5%22/%3E%3Ctext x=%2240%22 y=%2252%22 text-anchor=%22middle%22 font-size=%2238%22 fill=%22%238e8e93%22%3E📦%3C/text%3E%3C/svg%3E'"
                            />
                            <div class="name">${escapeHtml(app.name)}</div>
                            <div class="package">${escapeHtml(app.package)}</div>
                            <div class="developer">${escapeHtml(app.developer || 'Unknown developer')}</div>

                            <div class="detail-grid">
                                <span class="label">Version</span>
                                <span class="value">${escapeHtml(app.latest_version || '-')}</span>
                                <span class="label">Size</span>
                                <span class="value">${app.size_mb ? app.size_mb + ' MB' : '-'}</span>
                                <span class="label">Min SDK</span>
                                <span class="value">${app.min_sdk || '-'}</span>
                                <span class="label">Target SDK</span>
                                <span class="value">${app.target_sdk || app.targetSdk || '-'}</span>
                            </div>

                            <div class="categories">
                                ${(app.categories || []).map(c =>
                                    `<span>${escapeHtml(c)}</span>`
                                ).join('')}
                            </div>

                            <a class="download-btn" href="${app.download_url || '#'}" target="_blank" rel="noopener noreferrer">
                                Download APK
                            </a>

                            ${app.changelog ? `
                                <div class="changelog">
                                    <div class="changelog-title">What's New</div>
                                    <pre>${escapeHtml(app.changelog)}</pre>
                                </div>
                            ` : ''}
                        </div>
                    `;

            } catch (error) {
                console.error("Load error:", error);
                detailEl.innerHTML = `
                        <div class="error">
                            Failed to load app details.<br />
                            <small>${error.message}</small><br />
                            <button onclick="loadDetail()">Retry</button>
                        </div>
                    `;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadDetail();
    </script>

</body>
</html>
