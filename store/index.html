<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buge Store</title>
  
  <link rel="icon" href="icon.png" type="image/png" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <link rel="stylesheet" href="styles/style.css" />
  <style>
    .store-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .search-box {
      position: relative;
      flex: 1;
      min-width: 240px;
      max-width: 400px;
    }
    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 9999px;
      font-family: 'Google Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: background-color 0.3s cubic-bezier(0.2, 0, 0, 1), border-color 0.3s cubic-bezier(0.2, 0, 0, 1);
    }
    .search-box input:focus {
      background-color: var(--md-sys-color-surface-container-high);
      border-color: var(--md-sys-color-primary);
    }
    .search-box .material-symbols-outlined {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 1.25rem;
    }

    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .store-card {
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      border-radius: 24px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s cubic-bezier(0.2, 0, 0, 1), transform 0.3s cubic-bezier(0.2, 0, 0, 1);
      border: 1px solid transparent;
    }
    .store-card:hover {
      background-color: var(--md-sys-color-surface-container-high);
      transform: translateY(-2px);
    }
    .app-meta-row {
      display: flex;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--md-sys-color-on-surface-variant);
      margin: 0.75rem 0;
      flex-wrap: wrap;
    }
    .app-categories {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .app-categories span {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
    }
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--md-sys-color-on-surface-variant);
    }
  </style>
</head>
<body>

  <main class="container">

    <header class="hero" style="padding: 2rem 0 1rem;">
      <h1 style="font-size: 2.2rem; font-weight: 700; margin-bottom: 0.5rem;">Buge Store</h1>
      <p class="hero-subtitle" style="margin-bottom: 1rem;">发现并下载现代、开源的 Android 工具与软件。</p>
      <div class="wavy-line"></div>
    </header>

    <section>
      <div class="store-header-row">
        <div class="search-box">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="searchInput" placeholder="搜索应用..." oninput="filterApps()" />
        </div>
      </div>

      <div id="app-list" class="store-grid">
        <div class="empty-state">正在加载应用列表...</div>
      </div>

      <div class="social-row">
        <a href="https://github.com/BugeStudioTeam" class="btn-icon" rel="noopener" aria-label="GitHub">
          <svg class="custom-icon" viewBox="0 0 24 24">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </a>

        <a href="https://t.me/bugestudio" class="btn-icon" rel="noopener" aria-label="Telegram">
          <svg class="custom-icon" viewBox="0 0 24 24">
            <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.831-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
          </svg>
        </a>

        <a href="mailto:CreepyNightmares@proton.me" class="btn-icon" aria-label="Email">
          <svg class="custom-icon" viewBox="0 0 24 24">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </a>
      </div>
    </section>

  </main>

  <footer>
    <div class="footer-content">
      <div class="copyright">
        © 2026 Buge Studio
      </div>

      <div class="footer-controls">
        <div class="md3-dropdown-container" id="langDropdownContainer">
          <div class="md3-dropdown-trigger" onclick="toggleDropdown('langDropdownContainer')">
            <div class="md3-dropdown-info">
              <span class="md3-dropdown-label">Language</span>
              <span class="md3-dropdown-value" id="selectedLangText">简体中文</span>
            </div>
            <span class="material-symbols-outlined md3-dropdown-icon">arrow_drop_down</span>
          </div>
          <div class="md3-dropdown-menu">
            <div class="md3-menu-item" onclick="selectLanguage('English', 'https://bugestudio.website/store/', this)">
              <span>English</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectLanguage('Deutsch', 'https://bugestudio.website/de-DE/store/', this)">
              <span>Deutsch</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectLanguage('Русский', 'https://bugestudio.website/re-RU/store/', this)">
              <span>Русский</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item selected" onclick="selectLanguage('简体中文', 'https://bugestudio.website/zh-CN/store/', this)">
              <span>简体中文</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
          </div>
        </div>

        <div class="md3-dropdown-container" id="themeDropdownContainer">
          <div class="md3-dropdown-trigger" onclick="toggleDropdown('themeDropdownContainer')">
            <div class="md3-dropdown-info">
              <span class="md3-dropdown-label">Theme</span>
              <span class="md3-dropdown-value" id="selectedThemeText">Light</span>
            </div>
            <span class="material-symbols-outlined md3-dropdown-icon">arrow_drop_down</span>
          </div>
          <div class="md3-dropdown-menu">
            <div class="md3-menu-item selected" onclick="selectTheme('light', 'Light', this)">
              <span>Light</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectTheme('light-medium-contrast', 'Light (Medium)', this)">
              <span>Light (Medium)</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectTheme('light-high-contrast', 'Light (High)', this)">
              <span>Light (High)</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectTheme('dark', 'Dark', this)">
              <span>Dark</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectTheme('dark-medium-contrast', 'Dark (Medium)', this)">
              <span>Dark (Medium)</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
            <div class="md3-menu-item" onclick="selectTheme('dark-high-contrast', 'Dark (High)', this)">
              <span>Dark (High)</span>
              <span class="material-symbols-outlined check-icon">check</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <script>
    let allApps = [];

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    async function fetchApps() {
      try {
        const response = await fetch('apps.json');
        allApps = await response.json();
        renderApps(allApps);
      } catch (e) {
        console.error("加载应用失败:", e);
        document.getElementById('app-list').innerHTML = `
          <div class="empty-state" style="color: var(--md-sys-color-error);">
            无法加载 apps.json，请确保接口正常。
          </div>
        `;
      }
    }

    function renderApps(apps) {
      const listEl = document.getElementById('app-list');
      if (!apps || apps.length === 0) {
        listEl.innerHTML = `<div class="empty-state">没有找到匹配的应用。</div>`;
        return;
      }
      
      listEl.innerHTML = apps.map(app => `
        <a href="detail.html?id=${encodeURIComponent(app.id)}" class="store-card">
          <div>
            <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 0.25rem;">${escapeHtml(app.name)}</h3>
            <div style="font-size: 0.9rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 0.5rem;">${escapeHtml(app.short_description || '')}</div>
            
            <div class="app-meta-row">
              <span>v${escapeHtml(app.latest_version || '?')}</span>
              <span>•</span>
              <span>${app.size_mb || '?'} MB</span>
              <span>•</span>
              <span>SDK ${app.min_sdk || '?'}</span>
            </div>

            <div class="app-categories">
              ${(app.categories || []).map(c => `<span>${escapeHtml(c)}</span>`).join("")}
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--md-sys-color-outline-variant); padding-top: 0.75rem; margin-top: 0.5rem;">
            <span style="font-size: 0.85rem; color: var(--md-sys-color-primary); font-weight: 500;">${escapeHtml(app.developer || 'Buge Studio')}</span>
            <span class="btn btn-filled" style="padding: 0.4rem 0.9rem; font-size: 0.85rem;" onclick="event.stopPropagation();event.preventDefault();window.open('${escapeHtml(app.download_url || '#')}','_blank')">
              下载
            </span>
          </div>
        </a>
      `).join("");
    }

    function filterApps() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!keyword) {
        renderApps(allApps);
        return;
      }
      const filtered = allApps.filter(app => {
        return (app.name && app.name.toLowerCase().includes(keyword)) ||
               (app.short_description && app.short_description.toLowerCase().includes(keyword)) ||
               (app.description && app.description.toLowerCase().includes(keyword));
      });
      renderApps(filtered);
    }

    fetchApps();
  </script>
  <script src="js/main.js"></script>
</body>
</html>
