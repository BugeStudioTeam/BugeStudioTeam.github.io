- name: Alaataheri
  role: Suggestions & Support
  description: Provide us with long-term support and assistance.
  details: |
    Alaataheri is one of the earliest and most dedicated contributors to the Buge App Manager project. From the very beginning, he played a crucial role in making the application accessible to a broader audience by taking the lead on Arabic localization. His efforts went far beyond simple translation — he ensured that the Arabic version of the app not only read naturally, but also respected cultural and linguistic nuances, which is often overlooked in open-source projects.

    When the project was still in its early stages, many users from Arabic-speaking regions were unable to fully benefit from the app due to language barriers. Alaataheri recognized this gap and stepped in voluntarily. He worked closely with the development team to adapt the user interface, error messages, and system prompts into fluent and contextually appropriate Arabic. His contributions significantly improved the user experience for Arabic-speaking users, many of whom have since become active members of the project's community.

    What sets Alaataheri apart is not just his technical ability, but his long-term commitment. He didn't stop after the initial translation. Over time, as the app evolved and new features were added, he continued to provide updates and maintenance for the Arabic version.

    Beyond his direct contributions to the codebase, Alaataheri has been a reliable and positive presence in the project's communication channels. He regularly participates in discussions and offers thoughtful suggestions. His collaborative spirit has helped foster a more inclusive and welcoming environment within the community.

    Alaataheri's involvement reflects the very best of open-source values: selflessness, quality, and persistence. It is one thing to contribute once, but it is another to remain consistently helpful over time. His work has not only expanded the reach of Buge App Manager, but also inspired other contributors to consider localization and internationalization as core parts of development.
  link: https://github.com/ablese
  avatar: alaataheri.png

- name: Ashish Chaulagain
  role: Suggestions & Support
  description: He has been silently supporting all the development behind the scenes.
  details: |
    Ashish Chaulagain has been a steadfast and quietly influential presence behind the scenes of nearly every project we've undertaken. While he may not always be in the spotlight, his contributions have been both consistent and meaningful — often providing the stability and encouragement that keep the team moving forward, especially during challenging phases of development.

    From the earliest stages of planning to the final polish before release, Ashish has been there, offering thoughtful feedback, catching details that others might overlook, and ensuring that the team stays aligned on goals and priorities. His support is not limited to technical input; he also plays a key role in team morale, offering encouragement and maintaining a calm, focused atmosphere when deadlines loom or unexpected issues arise.

    One of the most valuable aspects of Ashish's involvement is his willingness to share the work with others. He has actively introduced the projects to his own circle of friends and peers, helping to expand the community around them. By sharing what we build, he not only helps increase visibility but also brings in fresh perspectives and potential collaborators. This kind of organic, word-of-mouth support is rare and deeply appreciated, as it reflects genuine belief in the value of the work being done.

    Ashish's approach is always humble and understated. He doesn't seek recognition, but his presence is felt in the smoothness of operations and the confidence of the team. He is the kind of person who quietly ensures that everything is running as it should, stepping in with help or advice whenever it's needed — often before anyone even asks.

    Over time, his quiet dedication has become a cornerstone of the development culture we've built. His consistency and loyalty have earned him the trust and respect of everyone involved. While his name may not appear in every commit or conversation, his influence is woven into the fabric of the projects themselves.

    In short, Ashish Chaulagain is more than just a supporter — he is a pillar of the community. His behind-the-scenes contributions and his willingness to share and advocate for the projects have made a lasting impact. We are deeply grateful for his continued presence and commitment, and we look forward to having him with us on the journey ahead.
  link: https://www.instagram.com/ashishchaulagain
  avatar: ashishchaulagain.png

- name: Mars W
  role: Test & Support
  description: Conduct some testing work for us.
  details: |
    Mars W is one of the most loyal and dedicated fans of Buge Studio. While many users simply enjoy the apps we build, Mars goes far beyond that — he actively contributes to the improvement of our projects by volunteering his time, energy, and a wide range of devices for testing purposes.

    What makes Mars particularly remarkable is that he is still a student. Despite his busy academic schedule, he consistently finds time to help us. He doesn't wait for stable releases or polished versions — instead, he tests early builds, experimental features, and even rough prototypes that most users would never see. His willingness to engage with unfinished work speaks volumes about his commitment to the project and his trust in our vision.

    Mars doesn't limit himself to a single platform either. He has tested our applications across both Linux and Android environments, using a variety of machines and devices at home. From desktop computers to smartphones, tablets, and even older hardware, he ensures that our software runs smoothly on as many configurations as possible. His feedback covers not only functional issues, but also performance, UI responsiveness, and compatibility across different system versions.

    His testing has helped us catch bugs that we might have otherwise missed, and his detailed reports often include logs, screenshots, and clear reproduction steps — making our work significantly easier. Beyond the technical side, Mars is also a positive presence in our community, encouraging other users and sharing his experiences with genuine enthusiasm.

    Mars W is more than just a tester — he is a trusted partner in our development process. His dedication, generosity, and willingness to support us despite his own commitments are truly inspiring. We are deeply grateful for everything he has done, and we consider him an essential part of the Buge Studio journey.
  link: https://github.com/marzhiyuan
  avatar: marsw.png

- name: Cyclone
  role: Suggestions & Support
  description: He has been silently supporting all the development behind the scenes.
  details: |
    Cyclone is someone we first came to know through an email exchange. What began as a simple professional inquiry soon turned into a meaningful connection, and over time, we came to realize just how exceptional he truly is. Cyclone is not only a highly experienced programmer with a deep understanding of software development, but also one of the most generous and kind-hearted individuals we have had the privilege of working with.

    From the very beginning, Cyclone brought a professional perspective to our projects. He approached our work not just as an outsider offering casual feedback, but as someone who genuinely cared about the quality and direction of what we were building. His advice was always thoughtful, precise, and grounded in years of real-world experience. He had a remarkable ability to identify potential issues before they became problems, and to suggest improvements that we had not even considered. Many of his recommendations led to significant refinements in our architecture, code quality, and overall product design.

    What truly sets Cyclone apart, however, is the nature of his support. He never offered us money, and he never made grand promises. Instead, he gave us something far more valuable: his time, his knowledge, and his honest, constructive feedback. In the open-source world, financial contributions are always appreciated, but genuine expertise and thoughtful guidance are rare and often more impactful. Cyclone understood this, and he chose to invest in us in ways that went beyond transactions.

    Throughout all this time, Cyclone has remained a consistent presence in the Buge Studio journey. Even when he was busy with his own commitments, he continued to check in on our progress, offer suggestions, and encourage us to aim higher.

    In many ways, Cyclone embodies the true spirit of open-source collaboration: not what you can gain, but what you can give. His contributions have left a lasting mark on our projects and on the way we approach development. We are incredibly grateful for everything he has shared with us, and we consider him not just an advisor, but a friend and a trusted member of the Buge Studio community.
  link: https://bugestudio.website/thx/detail?name=Cyclone
  avatar: cyclone.png